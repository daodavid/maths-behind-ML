[project]
name = "maths-behind-ml"
version = "0.1.0"
description = "Maths and from-scratch implementations behind machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scipy",
    "matplotlib-venn",
    "category-encoders",
    "jupyter",
    "ipykernel",
    "ipython",
    "nbformat",
]

[project.optional-dependencies]
nlp = [
    "spacy",
]

[tool.uv]
package = false
